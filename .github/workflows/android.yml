name: Build Kivy Crypto App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update || true
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev
        pip3 install --user --upgrade "buildozer>=1.5.0" cython virtualenv

    # වැදගත්ම කොටස: Buildozer බලාපොරොත්තු වන නිවැරදිම SDK/cmdline-tools ව්‍යුහය අතින්ම සකස් කිරීම
    - name: Pre-setup Android SDK for Buildozer
      run: |
        # බිල්ඩර් එකේ මූලික ෆෝල්ඩර් සෑදීම
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
        
        # දැනට පවතින SDK එක නිවැරදි ස්ථානයට ලින්ක් කිරීම
        ln -s $ANDROID_HOME/cmdline-tools/latest ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest || true
        ln -s $ANDROID_HOME/licenses ~/.buildozer/android/platform/android-sdk/licenses || true
        
        # Buildozer සොයන පැරණි 'tools' ෆෝල්ඩරයේ කෙටිමඟ සකස් කිරීම
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || true
        
        # බලපත්‍ර (Licenses) තහවුරු කිරීම
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Fix Directory Permissions
      run: |
        sudo chown -R runner:docker $GITHUB_WORKSPACE
        chmod -R 755 $GITHUB_WORKSPACE

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:$HOME/.local/bin
        buildozer -v android debug
      continue-on-error: false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CryptoBot-APK
        path: bin/*.apk
